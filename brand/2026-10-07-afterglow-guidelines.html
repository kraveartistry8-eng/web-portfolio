<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterglow Brand Guidelines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
  /* Generated by tools/build_guidelines.py from brand/resources/design-tokens.json.
     Do not edit by hand: every value here is rendered from a recorded token, and the
     positions in the fall are computed from the ramp rather than typed.

     The fall runs #D8B260 to #341D5E over the whole document and never resets.
     Crossover, where #EEECEA first clears 4.5:1 on the ground: 50.00%.
     Inversion, where dark and light display type read alike at 4.15:1: 45.60%. */
  :root{
    --void:#080808; --surface-deep:#141414; --surface:#2B2B2B;
    --text:#EEECEA; --muted:#C0C0C0; --border:rgba(192,192,192,0.22);
    --s1:#D8B260; --s2:#BC6F4C; --s3:#893A50; --s4:#341D5E;
    --display:'Instrument Serif',Georgia,serif;
    --body:'Space Grotesk',system-ui,sans-serif;
    --xs:0.8rem; --base:1.0rem; --md:1.25rem; --lg:1.5625rem;
    --xl:1.953125rem; --x2:2.44125rem; --x3:3.051875rem; --x4:3.815rem;
    --sp-2xs:4px; --sp-xs:8px; --sp-sm:12px; --sp-md:16px;
    --sp-lg:24px; --sp-xl:32px; --sp-2xl:48px; --sp-3xl:64px;
    --radius:0px; --shadow:none;
    --dur:450ms; --ease:cubic-bezier(0.2, 0, 0.2, 1);
    --gut:clamp(20px,4vw,64px); --rail:92px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--void);color:var(--text);
    font-family:var(--body);font-weight:350;font-size:var(--base);line-height:1.75}

  /* The slug. Fixed, on the void, outside the fall. It replaces a four-field footer
     because the rail already carries position and two indicators would compete. */
  .slug{position:fixed;top:0;left:0;z-index:5;display:flex;gap:var(--sp-sm);
    align-items:baseline;padding:var(--sp-sm) var(--gut);background:var(--void);
    font-size:var(--xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
  .slug b{color:var(--text);font-weight:400}

  /* The fall. One gradient on the document, sized to its full height, scrolling with
     the content and never fixed. It is the only background in the document. */
  .doc{position:relative;display:grid;
    grid-template-columns:minmax(0,1fr) clamp(170px,23%,240px) var(--rail);
    background:linear-gradient(180deg,
      var(--s1) 0%, var(--s2) 33.3333%, var(--s3) 66.6667%, var(--s4) 100%)}

  .measure{grid-column:1;padding:calc(var(--sp-3xl) * 2) var(--gut) var(--sp-3xl)}
  .sec{min-height:1280px;padding-block:var(--sp-3xl)}
  .sec + .sec{border-top:1px solid var(--border)}
  .sechead{font-family:var(--display);font-size:var(--x2);line-height:1.12;
    letter-spacing:-0.02em;margin:0;font-weight:400}
  .opening{min-height:720px;display:flex;align-items:flex-end}
  .wordmark{font-family:var(--display);font-weight:400;margin:0;
    font-size:clamp(var(--x3),11vw,8rem);line-height:1;letter-spacing:0.06em}

  /* Above the inversion the ground is light, so display type is set in the void.
     Below it the ground carries primary. Neither is a preference. */
  .opening .wordmark,.sec[data-folio="01"] .sechead,.sec[data-folio="02"] .sechead,
  .sec[data-folio="03"] .sechead{color:var(--void)}
  .sec[data-folio="04"] .sechead,.sec[data-folio="05"] .sechead,
  .sec[data-folio="06"] .sechead,.sec[data-folio="07"] .sechead,
  .sec[data-folio="08"] .sechead{color:var(--text)}

  /* The ledger. A void column carrying the document's readings, each row anchored to
     the position of the value it describes. Empty until Task 7 fills it. */
  .ledger{grid-column:2;position:relative;background:var(--void);
    border-left:1px solid var(--border)}

  /* The rail. A void strip outside the ledger. It is the folio; there is no page number. */
  .rail{grid-column:3;position:relative;background:var(--void);
    border-left:1px solid var(--border)}
  .rm{position:absolute;right:var(--sp-sm);top:calc(var(--at) * 100%);
    transform:translateY(-50%);text-align:right;font-size:var(--xs);
    font-variant-numeric:tabular-nums;color:var(--text);font-weight:400;line-height:1.3}
  .rm.first{transform:none;top:var(--sp-xs)}
  .rm.last{transform:none;top:auto;bottom:var(--sp-xs)}
  .rm i{font-style:normal;display:block;font-size:0.656rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .rm u{text-decoration:none;color:var(--muted);margin-left:2px}
  .rail .tick{position:absolute;right:0;width:9px;height:1px;background:var(--s1);
    top:calc(var(--at) * 100%)}
  /* The marker moves with scroll on the same linear mapping as the ground. */
  .marker{display:block;position:sticky;top:50svh;margin-left:auto;width:2px;height:46px;
    background:var(--s1);opacity:.85}

  /* The crossover. The one horizontal rule in the document that is not a section
     boundary, drawn where the fall first carries body copy. */
  .crossover{position:absolute;left:0;top:50.0000%;width:calc(100% - var(--rail));
    display:flex;align-items:center;gap:var(--sp-sm);padding-inline:var(--gut);
    pointer-events:none}
  .crossover span{flex:1;height:1px;background:rgba(238,236,234,.45)}
  .crossover em{font-style:normal;font-size:var(--xs);letter-spacing:.14em;
    text-transform:uppercase;color:var(--text);white-space:nowrap}

  a{color:var(--s1);text-decoration:none;border-bottom:1px solid rgba(216,178,96,.35);
    transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
  a:hover,a:focus-visible{color:#A8832F;border-color:rgba(168,131,47,.3)}

  @media (max-width:860px){
    .doc{grid-template-columns:1fr}
    .measure{grid-column:1;padding:calc(var(--sp-2xl) * 2) var(--gut) var(--sp-2xl)}
    .ledger{grid-column:1;border-left:0}
    .rail{grid-column:1;position:fixed;top:0;left:0;right:0;height:3px;
      border-left:0;background:transparent;z-index:6}
    .rm,.rail .tick{display:none}
    .marker{display:block;position:fixed;top:0;left:0;width:0;height:3px;margin:0}
    .crossover{width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    a{transition:none}
  }
</style>
</head>
<body>

  <div class="slug"><b>Afterglow</b><span>Brand Guidelines</span></div>

  <div class="doc">
    <main class="measure">
    <section class="sec opening" id="opening">
      <h1 class="wordmark">Afterglow</h1>
    </section>
    <section class="sec" id="one-line" data-folio="01">
      <h2 class="sechead">What this is</h2>
    </section>
    <section class="sec" id="stages" data-folio="02">
      <h2 class="sechead">The four stages</h2>
    </section>
    <section class="sec" id="surfaces" data-folio="03">
      <h2 class="sechead">The surface map</h2>
    </section>
    <section class="sec" id="roles" data-folio="04">
      <h2 class="sechead">Stage roles</h2>
    </section>
    <section class="sec" id="type" data-folio="05">
      <h2 class="sechead">Type</h2>
    </section>
    <section class="sec" id="measures" data-folio="06">
      <h2 class="sechead">Spacing, radius, shadow, motion</h2>
    </section>
    <section class="sec" id="usage" data-folio="07">
      <h2 class="sechead">Usage</h2>
    </section>
    <section class="sec" id="voice" data-folio="08">
      <h2 class="sechead">Voice</h2>
    </section>
    </main>

    <aside class="ledger" aria-label="Measurements"></aside>

    <nav class="rail" aria-label="Position in the fall">
      <b class="rm first" style="--at:0.0000"><i>Top</i>0.781<u>L</u></b>
      <b class="rm" style="--at:0.5000"><i>Crossover</i>0.540<u>L</u></b>
      <b class="rm last" style="--at:1.0000"><i>End</i>0.301<u>L</u></b>
      <span class="tick" style="--at:0.5000"></span>
      <span class="marker"></span>
    </nav>

    <div class="crossover" aria-hidden="true">
      <em>Body copy may begin</em><span></span><em>4.52:1</em>
    </div>
  </div>

</body>
</html>
