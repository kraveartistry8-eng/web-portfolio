<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember rerun directions</title>
<style>
  :root{--ink:#EEECEA;--ground:#080808}
  html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font:13px/1.4 "Space Grotesk",system-ui,sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:none}
  .bar{position:fixed;left:16px;bottom:16px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;align-items:center;max-width:calc(100vw - 32px)}
  .bar button{all:unset;cursor:pointer;padding:7px 12px;background:rgba(8,8,8,.72);border:1px solid rgba(238,236,234,.22);letter-spacing:.06em}
  .bar button[aria-pressed="true"]{background:#EEECEA;color:#080808}
  .bar .sep{width:12px}
  .note{position:fixed;right:16px;top:16px;max-width:40ch;padding:10px 12px;background:rgba(8,8,8,.72);border:1px solid rgba(238,236,234,.22);z-index:2}
  .note b{display:block;font-weight:500;margin-bottom:2px}
  body.clean .bar, body.clean .note{display:none}
</style>
</head>
<body>
<canvas id="c2"></canvas>
<canvas id="gl"></canvas>
<div class="bar" role="toolbar" aria-label="Direction and page">
  <button data-d="A" aria-pressed="true">A · Raking light</button>
  <button data-d="B" aria-pressed="false">B · Dusk passes (did not clear)</button>
  <button data-d="C" aria-pressed="false">C · Contour</button>
  <span class="sep"></span>
  <button data-d="c3" aria-pressed="false">c3 (the floor)</button>
  <span class="sep"></span>
  <button data-d="X1" aria-pressed="false">c3 + A, half</button>
  <button data-d="X2" aria-pressed="false">c3 + A, a third</button>
  <span class="sep"></span>
  <button data-d="D" aria-pressed="false">D · Bend</button>
  <button data-d="E" aria-pressed="false">E · Relief (did not clear)</button>
  <button data-d="F" aria-pressed="false">F · Strata</button>
  <span class="sep"></span>
  <button data-d="S1" aria-pressed="false">S1 · Satin</button>
  <button data-d="S2" aria-pressed="false">S2 · Satin, sheen only</button>
  <button data-d="S3" aria-pressed="false">S3 · Satin, warm crest</button>
  <span class="sep"></span>
  <button data-d="T1" aria-pressed="false">T1 · Crease</button>
  <button data-d="T2" aria-pressed="false">T2 · Drape</button>
  <button data-d="T3" aria-pressed="false">T3 · Gathered</button>
  <span class="sep"></span>
  <button data-d="U1" aria-pressed="false">U1 · Sheet, silk</button>
  <button data-d="U2" aria-pressed="false">U2 · Sheet, satin</button>
  <button data-d="U3" aria-pressed="false">U3 · Sheet, heavy</button>
  <span class="sep"></span>
  <button data-p="03" aria-pressed="true">03 gold</button>
  <button data-p="09" aria-pressed="false">09 rose card</button>
  <button data-p="11" aria-pressed="false">11 ember</button>
  <button data-p="16" aria-pressed="false">16 night</button>
</div>
<div class="note" id="note"></div>
<script>
// Ember rerun, Step 3 directions (13 Oct 2026). c3 runs here exactly as in a2-family.html; A, B and C share its input and glide.
const NOTES = {
  A: ["A · Raking light", "From the grazing-light film. The ground never lights; only edges do (type, hairlines, swatch and photo edges), and mostly the side facing the light. Warm where fresh, cooling down the fall as it fades in under a second."],
  B: ["B · Dusk passes, did not clear the floor", "Lost to c3 in two blind rounds: read as fog or a smudge rather than light. Kept for reference only. From the glacier title screen. No edges and no light on type or photographs: the ground itself answers. On gold and rose it falls a step further toward night where you pass; on night pages it lifts in tone. Wide, soft, slow to settle."],
  C: ["C · Contour", "From the glaciers. The cursor shapes the ground into a field drawn only as hairlines, the guide's own 1px rule, with every fourth line in the next stage of the fall. Lines bend around the path and relax as it settles. Type and photographs are never touched."],
  c3: ["c3 · the floor", "The chosen prototype, unchanged: a short warm light that cools down the fall, seen on surfaces, with the glide."],
  X1: ["c3 + A, half", "c3 exactly as it is, with the raking light of A laid over it at half strength: the warm light on surfaces, and the edges facing the oncoming light catching a little more of it."],
  X2: ["c3 + A, a third", "As half, with the raking light at a third of its strength."],
  D: ["D · Bend", "From the glaciers: the page is a soft surface. Ground, type and photographs are pushed aside around the cursor's path, as the mountains bend around it, then spring back as it settles. Form only, no light."],
  E: ["E · Relief, did not clear the floor", "Lost to c3 blind: broke into pale puffs that read as smoke. Kept for reference only. The ground rises into a soft ridge along the path, and a low light from the upper left finds its lit flank in the colours of the fall. Light only, never a darker side. Type and photographs stay still."],
  S1: ["S1 · Satin", "From the glacier title screen: the ground is a sheet of satin in the page's own colour. The cursor drags long soft folds into it, a sheen along each crest and a gentle trough beside it, stretched the way you move, relaxing over about two seconds. The folds pass under type and photographs; nothing on top moves."],
  S2: ["S2 · Satin, sheen only", "As Satin, but only the light on each crest: nothing goes darker than the ground."],
  U1: ["U1 · Sheet, silk", "The ground is a sheet of satin under tension. Drag, and long wrinkles run with the pull right across the page: a narrow sheen on each crest, a shadow on its far side. As the pull lets go they broaden into soft swells and the sheet lies flat again, in about two seconds. Type and photographs sit on top, untouched. Light, close wrinkles."],
  U2: ["U2 · Sheet, satin", "As silk, a heavier satin: wider wrinkles that hold a little longer."],
  U3: ["U3 · Sheet, heavy", "As satin, heavier still: a few broad, slow folds."],
  T1: ["T1 · Crease", "Satin that folds. The cursor presses a crease into the sheet and two soft folds rise either side of it, running the way you move: rounded crests with a narrow satin sheen, a sharp line at the bottom of each crease, a faint weave seen only inside the folds. They relax flat in about a second and a half. Type and photographs sit on top, untouched."],
  T2: ["T2 · Drape", "As Crease, with one broad, deep fold either side of the path, like heavy satin drawn by a finger."],
  T3: ["T3 · Gathered", "As Crease, with several finer folds bunched along the path, like light satin gathered."],
  S3: ["S3 · Satin, warm crest", "As Satin, with c3's light on the crest: gold where the fold is fresh, cooling down the fall to deep violet as it relaxes."],
  F: ["F · Strata", "Fine hairline strata, like the glacier's striations, appear in the ground near the cursor and bow around it, then settle straight and go out. Every fifth line in the next stage of the fall. Type and photographs stay clear."],
};
const FALL = [[216,178,96],[188,111,76],[137,58,80],[52,29,94]];
const c2 = document.getElementById("c2"), ctx = c2.getContext("2d"), glc = document.getElementById("gl");
const fx = document.createElement("canvas"), fctx = fx.getContext("2d");
const tmp = document.createElement("canvas"), tctx = tmp.getContext("2d");
const probe = document.createElement("canvas"), pctx = probe.getContext("2d", { willReadFrequently: true });
let W = 0, H = 0, DPR = 1, dir = "A", page = "03", img = new Image(), gimg = new Image(), ready = false, light = false;
let fresh = [], trail = [], last = null, lastT = 0;

function size() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  for (const c of [c2, fx, tmp, glc]) { c.width = W * DPR; c.height = H * DPR; }
  probe.width = 192; probe.height = Math.round(192 * H / W);
  if (ready) pctx.drawImage(img, ...cover(probe.width, probe.height));
  if (gl) fieldSize();
}
function cover(w, h) {
  const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  return [0, 0, img.naturalWidth, img.naturalHeight, (w - img.naturalWidth * s) / 2, 0, img.naturalWidth * s, img.naturalHeight * s];
}
function load(name) {
  ready = false; page = name; img = new Image(); gimg = new Image(); let n = 0;
  const done = () => { if (++n < 2) return; ready = true; size(); upload();
    const [r, g, b] = pctx.getImageData(probe.width >> 1, probe.height >> 1, 1, 1).data; light = (0.2126 * r + 0.7152 * g + 0.0722 * b) > 140; };
  img.onload = done; gimg.onload = done; img.src = "r/s" + name + ".png"; gimg.src = "r/g" + name + ".png";   // lossless, so compression ringing around type is not read as content reset();
}
function reset() { fctx.setTransform(1, 0, 0, 1, 0, 0); fctx.clearRect(0, 0, fx.width, fx.height); fresh = []; trail = []; if (typeof sheetSize === 'function' && gl) sheetSize(); }
const lum = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
function sample(x, y) {
  const px = Math.max(0, Math.min(probe.width - 1, Math.round(x / W * probe.width)));
  const py = Math.max(0, Math.min(probe.height - 1, Math.round(y / H * probe.height)));
  return Array.from(pctx.getImageData(px, py, 1, 1).data.slice(0, 3));
}
function lift(c, k = 1.6) { const L = lum(c), up = light ? 1 : 1.1, add = light ? 0 : 8; return c.map(v => Math.max(0, Math.min(255, (L + (v - L) * k) * up + add))); }
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function lay(x, y, t, sp, ang) { const c = sample(x, y), q = { x, y, t, sp, ang, base: c, c: lift(c) }; fresh.push(q); trail.push(q); }
let vel = { x: 0, y: 0 }, glide = null;
const GLIDE_T = 320, GLIDE_V = 0.6, STOP = 34;
addEventListener("pointermove", e => {
  const now = performance.now(), p = { x: e.clientX, y: e.clientY, t: now };
  const dx = last ? p.x - last.x : 0, dy = last ? p.y - last.y : 0, dist = Math.hypot(dx, dy);
  const sp = last ? Math.min(1.5, dist / Math.max(8, now - last.t)) : 0, ang = Math.atan2(dy, dx);
  if (last) { const k = 0.5, ddt = Math.max(8, now - last.t); vel = { x: vel.x * (1 - k) + dx / ddt * k, y: vel.y * (1 - k) + dy / ddt * k }; }
  const n = last ? Math.max(1, Math.ceil(dist / 10)) : 1;
  for (let i = 1; i <= n; i++) lay(last ? last.x + dx * i / n : p.x, last ? last.y + dy * i / n : p.y, now, sp, ang);
  last = p; glide = null;
});
function glideStep(now) {
  if (!last || now - last.t < STOP) return;
  if (!glide) {
    const v = Math.hypot(vel.x, vel.y); if (v < 0.02) return;
    const v0 = Math.min(GLIDE_V, v);
    glide = { x0: last.x, y0: last.y, ux: vel.x / v, uy: vel.y / v, v0, t0: now, d: 0, done: false };
  }
  if (glide.done) return;
  const t = Math.min(1, (now - glide.t0) / GLIDE_T), dist = glide.v0 * GLIDE_T / 3 * (1 - (1 - t) ** 3), sp = glide.v0 * (1 - t) ** 2;
  while (glide.d + 10 <= dist) { glide.d += 10; lay(glide.x0 + glide.ux * glide.d, glide.y0 + glide.uy * glide.d, now, sp, Math.atan2(glide.uy, glide.ux)); }
  if (t >= 1) glide.done = true;
}

// ---- c3, verbatim from a2-family.html ----
function round(p, r = 90 + 110 * p.sp, a = 0.10, c = p.c) {
  const g = fctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
  g.addColorStop(0, rgba(c, a)); g.addColorStop(0.5, rgba(c, a * 0.4)); g.addColorStop(1, rgba(c, 0));
  fctx.fillStyle = g; fctx.fillRect(p.x - r, p.y - r, 2 * r, 2 * r);
}
function cooling(now, o) {
  trail = trail.filter(p => now - p.t < o.life); fresh = [];
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0); fctx.clearRect(0, 0, W, H); fctx.globalCompositeOperation = "lighter";
  const every = o.every || 2;
  trail.forEach((p, i) => {
    if (i % every && i !== trail.length - 1) return;
    const age = (now - p.t) / o.life, k = Math.min(2.999, age * 3), j = k | 0;
    const cooled = mix(FALL[j], FALL[j + 1], k - j);
    const c = mix(lift(mix(p.base, FALL[0], 0.35), 1.5), cooled, Math.min(1, age * 1.4));
    round(p, (o.r + o.rs * p.sp) * (1 + age * o.grow), o.a * (1 - age) ** 1.3, c);
  });
  fctx.setTransform(1, 0, 0, 1, 0, 0); fctx.globalCompositeOperation = "source-over";
}
function surfaces() {
  tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, tmp.width, tmp.height);
  tctx.filter = `blur(${6 * DPR}px)`; tctx.drawImage(fx, 0, 0); tctx.filter = "none";
  tctx.globalCompositeOperation = "multiply";
  for (let i = 0; i < 3; i++) tctx.drawImage(img, ...cover(tmp.width, tmp.height));
  tctx.globalCompositeOperation = "destination-in"; tctx.filter = `blur(${6 * DPR}px)`; tctx.drawImage(fx, 0, 0); tctx.filter = "none";
  tctx.globalCompositeOperation = "source-over";
  ctx.save(); ctx.globalCompositeOperation = "screen"; ctx.drawImage(tmp, 0, 0); ctx.drawImage(tmp, 0, 0); ctx.restore();
}
function c3(now) { glideStep(now); cooling(now, { r: 52, rs: 40, a: 0.42, life: 900, grow: 0.25 }); surfaces(); }

// ---- A, B, C: WebGL2. A field of light is splatted from the trail, then one pass draws the page with it. ----
const gl = glc.getContext("webgl2", { premultipliedAlpha: false, antialias: false });
gl.getExtension("EXT_color_buffer_float");
const SET = {   // life ms, radius px, radius per speed, growth with age, how fast light fades (power)
  A: { life: 900, r: 56, rs: 40, grow: 0.25, fade: 1.3 },
  B: { life: 1500, r: 110, rs: 80, grow: 0.5, fade: 1.6 },
  C: { life: 1300, r: 120, rs: 70, grow: 0.15, fade: 1.2 },
};
const FOLD = {   // the folds: how many across a splat, how deep the crease, relief, how long a fold is along the path
  T1: { life: 1700, r: 300, rs: 110, folds: 2.6, base: .25, relief: 160, aniso: 1.6 },
  T2: { life: 1800, r: 340, rs: 120, folds: 1.6, base: .3, relief: 190, aniso: 1.7 },
  T3: { life: 1600, r: 280, rs: 100, folds: 3.8, base: .2, relief: 120, aniso: 1.5 },
};
SET.T1 = SET.T2 = SET.T3 = SET.A;
SET.U1 = SET.U2 = SET.U3 = SET.A;
const SHEET = {   // wrinkle spacing when tight (page px), relief, drag, how fast the pull lets go and the cloth fades (per step), reach, grain, pull that reads as fully tight (page px)
  U1: { scale: 230, relief: 1.0, drag: 3.0, decay: .986, reveal: 1, revealDecay: .99, diffuse: .24, R: 190, grain: .07, tightAt: 40 },
  U2: { scale: 320, relief: 1.15, drag: 3.4, decay: .989, reveal: 1, revealDecay: .992, diffuse: .24, R: 250, grain: .08, tightAt: 55 },
  U3: { scale: 440, relief: 1.3, drag: 3.8, decay: .991, reveal: 1, revealDecay: .994, diffuse: .24, R: 320, grain: .09, tightAt: 70 },
};
SET.S1 = SET.S2 = SET.S3 = { life: 1700, r: 230, rs: 120, grow: 0.3, fade: 1.2, shapePow: 1.7 };   // a fold relaxes over about a second and a half
SET.D = { life: 1100, r: 90, rs: 60, grow: 0.2, fade: 1.4 };
SET.E = { life: 1300, r: 110, rs: 70, grow: 0.3, fade: 1.3 };
SET.F = { life: 1400, r: 100, rs: 70, grow: 0.2, fade: 1.2 };
SET.X1 = SET.X2 = SET.A;   // the combined versions use A's light exactly, at a lower strength
const GAIN = { X1: 0.5, X2: 0.33 };
const ANISO = { S1: 1.35, S2: 1.35, S3: 1.35 };
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
function prog(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw gl.getProgramInfoLog(p); return p; }
// splat: a gaussian per trail point. r = light (fades with age), g = light x age (for the cooling colour), b = shape (fades slower)
const splat = prog(`#version 300 es
in vec2 corner; in vec2 ctr; in vec4 pa; in float pw;   // pa: radius, light, age, shape (A: light x cos of travel); pw: A, light x sin of travel; satin, the angle of travel
uniform vec2 res; uniform float aniso; out vec2 q; out vec4 v;
void main(){ q = corner; v = vec4(pa.yzw, aniso > 0. ? 0. : pw);
  vec2 c = corner * pa.x;
  if (aniso > 0.) { c = vec2(corner.x * pa.x * aniso, corner.y * pa.x); float a = -pw; c = mat2(cos(a), sin(a), -sin(a), cos(a)) * c; }   // a fold is long along the way you move
  vec2 p = ctr + c; gl_Position = vec4(p / res * 2.0 - 1.0, 0.0, 1.0); }`,
`#version 300 es
precision highp float; in vec2 q; in vec4 v; out vec4 o;
void main(){ float g = exp(-dot(q, q) * 3.1); o = vec4(v.x * g, v.x * v.y * g, v.z * g, v.w * g); }`);
// folds: each splat is long along the way you move, and across it carries the profile of a pressed crease with rounded folds either side
const foldSplat = prog(`#version 300 es
in vec2 corner; in vec2 ctr; in vec4 pa; in float pw;   // pa: radius, strength, age, unused; pw: angle of travel
uniform vec2 res; uniform float aniso; out vec2 q; out float e; out float wv;
void main(){ q = corner; e = pa.y; wv = pa.w;
  vec2 c = vec2(corner.x * pa.x * aniso, corner.y * pa.x); float a = -pw; c = mat2(cos(a), sin(a), -sin(a), cos(a)) * c;
  gl_Position = vec4((ctr + c) / res * 2.0 - 1.0, 0.0, 1.0); }`,
`#version 300 es
precision highp float; in vec2 q; in float e; in float wv; uniform float folds, base; out vec4 o;
void main(){ float g = exp(-dot(q, q) * 3.1); float sn = sin(q.y * folds * (1. + .28 * wv) + .6 * wv);
  float fold = sqrt(sn * sn + .015);   // low on the crease, rounded between; the crease softened so it never reads as a scratch
  o = vec4(e * g * mix(base, 1., fold), e * g, 0., 0.); }`);
// the fabric's drag: r,g = how far the cloth has been dragged (sheet px), b = how much of it the cursor has revealed. First order, so it never rings.
const simStep = prog(`#version 300 es
in vec2 corner; out vec2 uv; void main(){ uv = corner * 0.5 + 0.5; gl_Position = vec4(corner, 0.0, 1.0); }`,
`#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform sampler2D prev; uniform vec2 res, p0, p1, vel; uniform float R, drag, decay, reveal, revealDecay, diffuse, on;
void main(){
  vec2 px = 1. / res, x = uv * res;
  vec2 a = x - p1, b = p0 - p1; float t = clamp(dot(a, b) / max(dot(b, b), 1e-4), 0., 1.);
  float w = on * exp(-pow(length(a - b * t) / R, 2.));
  vec4 c = texture(prev, uv), l = texture(prev, uv + vec2(px.x, 0.)), r = texture(prev, uv - vec2(px.x, 0.)), u = texture(prev, uv + vec2(0., px.y)), d = texture(prev, uv - vec2(0., px.y));
  vec4 lap = l + r + u + d - 4. * c;
  vec2 D = (c.rg + diffuse * lap.rg) * decay + w * vel * drag;   // dragged with the cursor, spreading softly, sliding back
  float wr = on * exp(-pow(length(a - b * t) / (R * 3.2), 2.));   // the cloth is revealed well beyond where the cursor touches it
  float V = max((c.b + diffuse * lap.b) * revealDecay, wr * min(1., .35 + length(vel) * .5) * reveal);
  o = vec4(D, V, 1.);
}`);
const show = prog(`#version 300 es
in vec2 corner; out vec2 uv; void main(){ uv = corner * 0.5 + 0.5; gl_Position = vec4(corner, 0.0, 1.0); }`,
`#version 300 es
precision highp float;
uniform sampler2D page, ground, field, keep, fold, sheet; uniform vec2 res; uniform vec4 rect; uniform int mode; uniform float px; uniform int dbg; uniform float gain; uniform int live; uniform float relief; uniform vec2 sres; uniform float grainAmt;
in vec2 uv; out vec4 o;
const vec3 F0 = vec3(216.,178.,96.)/255., F1 = vec3(188.,111.,76.)/255., F2 = vec3(137.,58.,80.)/255., F3 = vec3(52.,29.,94.)/255., INK = vec3(8.)/255.;
vec3 fall(float t){ t = clamp(t, 0., 1.) * 4.; if (t < 1.) return mix(F0, F1, t); if (t < 2.) return mix(F1, F2, t - 1.); if (t < 3.) return mix(F2, F3, t - 2.); return mix(F3, INK, t - 3.); }
float lum(vec3 c){ return dot(c, vec3(.2126, .7152, .0722)); }
vec2 iuv(vec2 frag){ vec2 p = vec2(frag.x, res.y - frag.y); return (p - rect.xy) / rect.zw; }   // screen px (top-left origin) to image uv
vec3 tex(sampler2D s, vec2 frag){ return texture(s, iuv(frag)).rgb; }
// the page as drawn: the screenshot, or, when combined, c3's frame (a viewport-sized canvas, top row first)
vec3 texP(vec2 frag){ return live == 1 ? texture(page, vec2(frag.x / res.x, 1. - frag.y / res.y)).rgb : texture(page, iuv(frag)).rgb; }
float where(vec3 g){ float best = 0., d = 9.; for (int i = 0; i <= 32; i++){ float t = float(i) / 32.; float e = distance(g, fall(t)); if (e < d){ d = e; best = t; } } return best; }
vec3 screen(vec3 a, vec3 b){ return 1. - (1. - a) * (1. - b); }
uniform float clothScale, W6, tightAt;
float hsh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hsh(i), hsh(i + vec2(1., 0.)), f.x), mix(hsh(i + vec2(0., 1.)), hsh(i + vec2(1., 1.)), f.x), f.y); }
float fbm(vec2 p){ return vn(p) * .65 + vn(p * 2.03 + 7.1) * .35; }
// the cloth: long, soft, curving folds, from noise warped by noise
float cloth(vec2 P){ vec2 p = P / clothScale; vec2 q = p + vec2(fbm(p * .7), fbm(p * .7 + 3.3)) * 1.6;
  return fbm(q * vec2(1., .55)); }
// type and photographs, with a clearance around them so nothing on the ground runs into a line of text
float near(vec2 f, float r){ float m = 0.; for (int i = 0; i < 12; i++){ float a = float(i) * .5236; vec2 o = vec2(cos(a), sin(a)) * r;
  m = max(m, smoothstep(.035, .11, distance(tex(page, f + o), tex(ground, f + o)))); } return m; }
