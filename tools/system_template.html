<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%(title)s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Generated by tools/build_system.py from brand/resources/design-tokens.json.
     Do not edit by hand: every value and every ratio here is rendered from a token. */
  :root{
    --void:%(void)s; --surface-deep:%(sdeep)s; --surface:%(surf)s;
    --text:%(text)s; --muted:%(muted)s; --border:%(border)s; --s1:%(s1)s;
    --display:'%(display)s',Georgia,serif;
    --body:'%(body)s',system-ui,sans-serif;
    --xs:%(xs)srem; --base:%(base)srem; --md:%(md)srem; --lg:%(lg)srem;
    --xl:%(xl)srem; --x2:%(x2)srem; --x3:%(x3)srem; --x4:%(x4)srem;
    --sp-2xs:%(sp2xs)spx; --sp-xs:%(spxs)spx; --sp-sm:%(spsm)spx; --sp-md:%(spmd)spx;
    --sp-lg:%(splg)spx; --sp-xl:%(spxl)spx; --sp-2xl:%(sp2xl)spx; --sp-3xl:%(sp3xl)spx;
    --radius:%(radius)spx; --dur:%(dur)sms; --ease:%(ease)s;
    --pad:clamp(24px,3.4vw,56px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%%}
  body{margin:0;background:var(--void);color:var(--text);font-family:var(--body);
    font-size:var(--base);line-height:1.55;-webkit-font-smoothing:antialiased}
  .deck{display:flex;flex-direction:column;gap:var(--sp-lg);
    padding:var(--sp-lg) var(--sp-lg) var(--sp-3xl);max-width:1360px;margin-inline:auto}

  /* A sheet. Discrete, bounded, and the same proportion as the page it prints to, so
     the screen artifact and the printed one are the same object. */
  .sheet{position:relative;display:flex;flex-direction:column;
    border:1px solid var(--border);background:var(--void);
    padding:var(--pad) var(--pad) 0;min-height:min(760px,86svh)}
  .grid{flex:1;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);
    gap:var(--sp-2xl);padding-bottom:var(--sp-xl)}
  .sheet.wide .grid{grid-template-columns:minmax(0,3fr) minmax(0,9fr)}
  .col-l{max-width:34ch}
  h2.t{font-family:var(--display);font-weight:400;font-size:var(--x2);line-height:1.02;
    letter-spacing:-.015em;margin:0 0 var(--sp-md)}
  .lead{margin:0;color:var(--muted);font-size:var(--base);max-width:40ch}
  .lead a{color:var(--s1);text-decoration-color:rgba(216,178,96,.45);text-underline-offset:3px}

  .foot{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:var(--sp-md);
    align-items:baseline;border-top:1px solid var(--border);
    padding:var(--sp-sm) 0 var(--sp-md);font-size:var(--xs);color:var(--muted);
    letter-spacing:.04em}
  .foot .mark{color:var(--text);letter-spacing:.14em;text-transform:uppercase}
  .foot .pg{font-variant-numeric:tabular-nums;color:var(--text)}

  /* cover */
  .cover .covergrid{flex:1;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);
    gap:var(--sp-2xl);align-items:center;padding-bottom:var(--sp-xl)}
  .kick{margin:0 0 var(--sp-lg);font-size:var(--xs);letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .wordmark{font-family:var(--display);font-weight:400;margin:0 0 var(--sp-lg);
    font-size:clamp(var(--x3),9vw,7rem);line-height:.92;letter-spacing:-.02em}
  .covline{margin:0;font-family:var(--display);font-size:var(--xl);line-height:1.2;
    max-width:24ch;color:var(--text)}
  .coverswatch{display:grid;grid-template-rows:repeat(4,1fr);height:min(420px,46svh)}
  .coverswatch i{display:block}

  /* colour cards */
  .col-r{min-width:0}
  .cards,.col-r > .card{min-width:0}
  .col-r{display:flex;flex-direction:column;gap:var(--sp-lg);justify-content:flex-start}
  .card{display:grid;grid-template-columns:132px minmax(0,1fr);gap:var(--sp-lg);
    align-items:stretch;border-top:1px solid var(--border);padding-top:var(--sp-md)}
  .chip{min-height:84px}
  .cname{margin:0 0 var(--sp-xs);font-size:var(--md);font-weight:500}
  .card dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-sm);
    margin:0;font-size:var(--xs)}
  .card dt{color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
  .card dd{margin:0;font-variant-numeric:tabular-nums;color:var(--text)}

  /* tables */
  .tbl{width:100%%;border-collapse:collapse;font-size:var(--xs);
    font-variant-numeric:tabular-nums}
  .tbl th{text-align:left;font-weight:400;color:var(--muted);letter-spacing:.1em;
    text-transform:uppercase;padding:0 var(--sp-md) var(--sp-xs) 0;
    border-bottom:1px solid var(--border);white-space:nowrap}
  .tbl td{padding:var(--sp-sm) var(--sp-md) var(--sp-sm) 0;
    border-bottom:1px solid var(--border);vertical-align:middle}
  .tbl td:first-child{color:var(--text);white-space:nowrap}
  .tbl .use{color:var(--muted);white-space:normal}
  .mono{letter-spacing:.02em}
  .dot{display:inline-block;width:14px;height:14px;margin-right:var(--sp-sm);
    vertical-align:-2px}
  .dot.ring{box-shadow:0 0 0 1px var(--border) inset;background:transparent !important}
  .num{font-weight:500;color:var(--text)}
  .v{font-size:var(--xs);letter-spacing:.08em;text-transform:uppercase}
  .v.yes{color:var(--s1)}
  .v.no{color:var(--muted)}

  .roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-md);
    margin-top:var(--sp-lg)}
  .role{display:flex;gap:var(--sp-sm);border-top:1px solid var(--border);
    padding-top:var(--sp-sm)}
  .role .dot{margin-top:4px;flex:0 0 14px}
  .rname{margin:0 0 2px;font-size:var(--base)}
  .rname em{font-style:normal;color:var(--muted);font-size:var(--xs);
    letter-spacing:.08em;text-transform:uppercase;margin-left:var(--sp-xs)}
  .rrule{margin:0;color:var(--muted);font-size:var(--xs);max-width:36ch}

  /* type */
  .faces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-lg);
    margin-bottom:var(--sp-lg)}
  .face{border-top:1px solid var(--border);padding-top:var(--sp-sm)}
  .flab{margin:0 0 var(--sp-xs);font-size:var(--xs);letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .fsamp{margin:0 0 var(--sp-xs);font-size:var(--x2);line-height:1.05;letter-spacing:-.01em}
  .fsamp.serif{font-family:var(--display);font-weight:400}
  .fmeta{margin:0;font-size:var(--xs);color:var(--text)}
  .fuse{margin:2px 0 0;font-size:var(--xs);color:var(--muted)}
  .tspec{flex:1;display:flex;flex-direction:column;gap:var(--sp-xs);justify-content:space-between}
  .tstep{display:grid;grid-template-columns:48px minmax(0,1fr) 150px;gap:var(--sp-md);
    align-items:baseline;border-top:1px solid var(--border);padding-top:var(--sp-xs)}
  .tlab{font-size:var(--xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .tsamp{line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tnum{font-size:var(--xs);color:var(--muted);text-align:right;
    font-variant-numeric:tabular-nums;white-space:nowrap}

  /* space */
  .space{display:flex;flex-direction:column;gap:var(--sp-xs);margin-bottom:var(--sp-xl)}
  .sbar{display:grid;grid-template-columns:48px 1fr 150px;gap:var(--sp-md);
    align-items:center;border-top:1px solid var(--border);padding-top:var(--sp-xs)}
  .slab{font-size:var(--xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .sbox{display:block;height:14px;background:var(--s1)}
  .snum{font-size:var(--xs);color:var(--muted);text-align:right;
    font-variant-numeric:tabular-nums}
  .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-md)}
  .tile{background:var(--surface-deep);padding:var(--sp-md)}
  .tlabel{margin:0 0 var(--sp-xs);font-size:var(--xs);letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .tval{margin:0 0 var(--sp-xs);font-family:var(--display);font-size:var(--xl);line-height:1}
  .tnote{margin:0;font-size:var(--xs);color:var(--muted)}

  /* usage */
  .rulecard{border-left:2px solid var(--s1);padding:0 0 0 var(--sp-md);
    margin-bottom:var(--sp-xl)}
  .rk{margin:0 0 var(--sp-xs);font-size:var(--xs);letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .rbig{margin:0 0 var(--sp-sm);font-family:var(--display);font-size:var(--x2);
    line-height:1.05;letter-spacing:-.01em}
  .rsub{margin:0;color:var(--muted);font-size:var(--xs);max-width:60ch}
  .dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-md);
    margin-bottom:var(--sp-xl)}
  .do{background:var(--surface-deep);padding:var(--sp-md)}
  .do p{margin:0;font-size:var(--xs);color:var(--muted)}
  .dk{margin:0 0 var(--sp-xs) !important;letter-spacing:.12em;text-transform:uppercase;
    font-size:var(--xs)}
  .do.no .dk{color:var(--muted)}
  .do.yes .dk{color:var(--s1)}
  .stops p:last-child{margin:0;color:var(--muted);font-size:var(--xs);max-width:70ch}

  /* applied */
  .apps{flex:1;display:grid;align-items:stretch;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-lg)}
  .app{display:flex;flex-direction:column;gap:var(--sp-xs)}
  .alab{margin:0;font-size:var(--xs);letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted)}
  .appbody{flex:1;padding:var(--sp-md);display:flex;flex-direction:column;
    gap:var(--sp-sm);min-height:190px}
  .appimg{flex:1;min-height:92px}
  .aname{margin:0;font-family:var(--display);font-size:var(--md)}
  .aprice{margin:0;font-size:var(--xs);color:var(--muted)}
  .btn{display:inline-block;padding:var(--sp-sm) var(--sp-md);font-size:var(--xs);
    letter-spacing:.08em;text-transform:uppercase;text-align:center;
    transition:background var(--dur) var(--ease)}
  .anote{margin:0;font-size:var(--xs);color:var(--muted)}
  .anote2{margin:var(--sp-xs) 0 0;font-size:var(--xs);color:var(--muted);
    font-variant-numeric:tabular-nums}
  .step{padding:var(--sp-sm) var(--sp-md);font-size:var(--xs);color:var(--muted)}

  a{color:var(--s1)}
  a:hover,a:focus-visible{color:#A8832F}

  @media (max-width:900px){
    .deck{padding:var(--sp-sm) var(--sp-sm) var(--sp-2xl);gap:var(--sp-sm)}
    .sheet{padding:var(--sp-lg) var(--sp-lg) 0;min-height:0}
    .grid,.sheet.wide .grid,.cover .covergrid{grid-template-columns:1fr;gap:var(--sp-lg)}
    .coverswatch{grid-template-rows:none;grid-template-columns:repeat(4,1fr);height:120px}
    .card{grid-template-columns:72px minmax(0,1fr)}
    .card dl,.roles,.faces,.trio,.dos,.apps{grid-template-columns:1fr}
    .tstep,.sbar{grid-template-columns:40px minmax(0,1fr);row-gap:2px}
    .tnum,.snum{grid-column:2;text-align:left}
    .foot{grid-template-columns:1fr auto;row-gap:2px}
    .foot span:nth-child(2),.foot span:nth-child(3){display:none}
    .tbl{display:block;overflow-x:auto;white-space:nowrap}
  }

  @page{margin:0;size:Letter landscape}
  @media print{
    .deck{gap:0;padding:0;max-width:none}
    /* The box is the sheet of paper, less its margins. 8.4in left no room for the
       rounding Chromium does at a page boundary and pushed a ninth sheet out. */
    .sheet{break-after:page;page-break-after:always;min-height:0;height:8.05in;
      border:0;padding:0.36in 0.5in 0;overflow:hidden}
    .sheet:last-child{break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body>
<main class="deck">
%(sheets)s</main>
</body>
</html>
