<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%(title)s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Generated by tools/build_guide.py from brand/resources/design-tokens.json.
     Every value and every ratio renders from a token; do not edit by hand. */
  :root{
    --void:%(void)s; --surface-deep:%(sdeep)s; --surface:%(surf)s;
    --text:%(text)s; --muted:%(muted)s; --border:%(border)s;
    --s1:%(s1)s; --s4:%(s4)s;
    --display:'%(display)s',Georgia,serif; --body:'%(body)s',system-ui,sans-serif;
    --xs:%(xs)srem; --base:%(base)srem; --md:%(md)srem; --lg:%(lg)srem;
    --xl:%(xl)srem; --x2:%(x2)srem; --x3:%(x3)srem; --x4:%(x4)srem;
    --sp-2xs:%(sp2xs)spx; --sp-xs:%(spxs)spx; --sp-sm:%(spsm)spx; --sp-md:%(spmd)spx;
    --sp-lg:%(splg)spx; --sp-xl:%(spxl)spx; --sp-2xl:%(sp2xl)spx; --sp-3xl:%(sp3xl)spx;
    --radius:%(radius)spx; --dur:%(dur)sms; --ease:%(ease)s;
    --pad:clamp(26px,3.2vw,52px);
    --sheet-h:min(820px,94svh);
    --fall:%(fullfall)s;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%%}
  body{margin:0;background:var(--void);color:var(--text);font-family:var(--body);
    font-size:var(--base);line-height:1.55;-webkit-font-smoothing:antialiased}
  .deck{display:flex;flex-direction:column}

  /* A sheet carries its own slice of the fall. Readings sit in void panels on it,
     because a number read off a mid-ramp value is a number nobody can check. */
  .sheet{position:relative;display:flex;flex-direction:column;
    padding:var(--pad) var(--pad) 0;min-height:min(820px,94svh)}
  .grid{flex:1;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);
    gap:var(--sp-2xl);padding-bottom:var(--sp-xl)}
  .col-l{max-width:34ch}
  .col-r{display:flex;flex-direction:column;gap:var(--sp-md);min-width:0}
  h2.t{font-family:var(--display);font-weight:400;font-size:var(--x2);line-height:1.02;
    letter-spacing:-.015em;margin:0 0 var(--sp-sm)}
  .lead{margin:0;font-size:var(--base);max-width:38ch}

  /* Ink is measured against the sheet's own midpoint, never chosen. */
  .sheet.dark{color:#080808}
  .sheet.dark .lead{color:rgba(8,8,8,.74)}
  .sheet.light{color:var(--text)}
  .sheet.light .lead{color:var(--muted)}

  .foot{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:var(--sp-md);
    align-items:baseline;padding:var(--sp-sm) 0 var(--sp-md);font-size:var(--xs);
    letter-spacing:.04em;border-top:1px solid currentColor}
  .sheet.dark .foot{border-color:rgba(8,8,8,.3);color:rgba(8,8,8,.74)}
  .sheet.light .foot{border-color:var(--border);color:var(--muted)}
  .foot .mark{letter-spacing:.14em;text-transform:uppercase}
  .sheet.dark .foot .mark,.sheet.dark .foot .pg{color:#080808}
  .sheet.light .foot .mark,.sheet.light .foot .pg{color:var(--text)}
  .foot .pg{font-variant-numeric:tabular-nums}

  /* the void panel: the only place a reading is allowed to live */
  /* min-width:0 or the table's own minimum width wins and the panel grows past
     the column instead of scrolling inside it. */
  .panel{background:var(--void);color:var(--text);padding:var(--sp-md) var(--sp-lg);
    min-width:0;max-width:100%%;overflow-x:auto}
  .pk{margin:0 0 var(--sp-xs);font-size:var(--xs);letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .pk + .pk{margin-top:var(--sp-md)}
  .pl{margin:0 0 var(--sp-sm);font-size:var(--xs);color:var(--muted);max-width:62ch}
  .panel .pl:last-child{margin-bottom:0}
  .fine{margin:0;font-size:var(--xs);max-width:60ch}
  .sheet.dark .fine{color:rgba(8,8,8,.74)}
  .sheet.light .fine{color:var(--muted)}

  .tbl{width:100%%;border-collapse:collapse;font-size:var(--xs);
    font-variant-numeric:tabular-nums}
  .tbl th{text-align:left;font-weight:400;color:var(--muted);letter-spacing:.1em;
    text-transform:uppercase;padding:0 var(--sp-md) var(--sp-xs) 0;
    border-bottom:1px solid var(--border);white-space:nowrap}
  .tbl td{padding:var(--sp-xs) var(--sp-md) var(--sp-xs) 0;
    border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
  .tbl tr:last-child td{border-bottom:0}
  .tbl td:first-child{color:var(--text)}
  .tbl .use,.tbl .role{color:var(--muted);white-space:normal}
  .mono{letter-spacing:.02em}
  .num{color:var(--text)}
  .todo{color:var(--muted);font-style:italic}
  .dot{display:inline-block;width:12px;height:12px;margin-right:var(--sp-sm);
    vertical-align:-1px}
  .dot.ring{box-shadow:0 0 0 1px var(--border) inset}

  .srow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--sp-lg);
    align-items:center;padding:var(--sp-sm) 0;border-bottom:1px solid var(--border)}
  .srow:last-child{border-bottom:0}
  .chip{display:block;height:58px}
  .sname{margin:0 0 var(--sp-2xs);font-size:var(--md)}
  .srow dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-sm);
    margin:0;font-size:var(--xs)}
  .srow dt{color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .srow dd{margin:0;font-variant-numeric:tabular-nums}

  .rrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-sm)}
  .rr{display:flex;gap:var(--sp-sm)}
  .rr p{margin:0;font-size:var(--xs);color:var(--muted)}
  .rr .dot{margin-top:4px;flex:0 0 12px}

  .wmstage{flex:1;display:flex;align-items:center;justify-content:center;
    padding:var(--sp-xl) 0}
  .wmbox{position:relative;padding:var(--sp-lg);outline:1px dashed currentColor;
    outline-offset:0}
  .sheet.dark .wmbox{outline-color:rgba(8,8,8,.4)}
  .sheet.light .wmbox{outline-color:var(--border)}
  .wmtext{font-family:var(--display);font-size:clamp(44px,6vw,86px);line-height:1;
    display:block}
  .wmspace{position:absolute;inset:0;outline:1px solid currentColor;
    outline-offset:calc(var(--sp-lg) * -1);opacity:.45}

  .donts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-md)}
  .dont p{margin:0;font-size:var(--xs);color:var(--muted)}
  .dk{margin:0 0 var(--sp-2xs) !important;color:var(--text) !important;
    letter-spacing:.1em;text-transform:uppercase}

  .fallspec{display:grid;grid-template-columns:72px minmax(0,1fr);gap:var(--sp-md);
    min-width:0}
  .fallmeta{min-width:0}
  .fallbar{background:var(--fall);min-height:200px}
  .rules{margin:0;padding-left:1.1em;font-size:var(--xs);color:var(--muted);max-width:62ch}
  .rules li{margin-bottom:var(--sp-xs)}
  .rules li:last-child{margin-bottom:0}

  .faces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-lg)}
  .fsamp{margin:0 0 var(--sp-2xs);font-size:var(--x2);line-height:1.05}
  .fsamp.serif{font-family:var(--display)}
  .tspec{display:flex;flex-direction:column;gap:var(--sp-2xs)}
  .tstep{display:grid;grid-template-columns:44px minmax(0,1fr) 140px;gap:var(--sp-md);
    align-items:baseline;border-top:1px solid var(--border);padding-top:var(--sp-2xs)}
  .tlab{font-size:var(--xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .tsamp{line-height:1.06;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tnum{font-size:var(--xs);color:var(--muted);text-align:right;
    font-variant-numeric:tabular-nums;white-space:nowrap}

  .space{display:flex;flex-direction:column;gap:var(--sp-2xs);margin-bottom:var(--sp-sm)}
  .sstep{display:grid;grid-template-columns:40px minmax(0,1fr) 62px;gap:var(--sp-sm);
    align-items:center;font-size:var(--xs)}
  .sstep em{font-style:normal;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
    order:-1}
  .sstep i{display:block;height:10px;background:var(--s1)}
  .sstep b{font-weight:400;color:var(--muted);text-align:right;
    font-variant-numeric:tabular-nums}
  .gridstage{padding:var(--sp-md) 0}
  .gcols{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--sp-lg);height:120px}
  .gcols span{background:currentColor;opacity:.16}

  .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-md);
    margin-bottom:var(--sp-md)}
  .tval{margin:0 0 var(--sp-2xs);font-family:var(--display);font-size:var(--xl);
    line-height:1;color:var(--text)}
  .rbig{margin:0 0 var(--sp-xs);font-family:var(--display);font-size:var(--x2);
    line-height:1.05;color:var(--text)}

  /* The slot ratio is the fixed quantity and the grid height follows from it, so
     screen and print crop the same frames the same way. Columns change; 5:4 never does. */
  .stagehead{display:flex;align-items:baseline;justify-content:space-between;
    gap:var(--sp-md);flex-wrap:wrap}
  .stagename{margin:0;font-family:var(--display);font-weight:400;font-size:var(--x3);
    line-height:1}
  .stageread{display:inline-flex;align-items:center;gap:var(--sp-xs);font-family:ui-monospace,Menlo,monospace;
    font-size:var(--xs);white-space:nowrap}
  .stagerule{border:0;border-top:1px solid currentColor;margin:var(--sp-xs) 0 0;opacity:.4}
  /* The field is a share of the sheet, not of the column, so it is set once here and
     reads the same on all four stage sheets. */
  .imgs{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-xs);
    margin:calc(var(--sheet-h) * .14) 0 var(--sp-md)}
  .imgs > figure{position:relative;margin:0;aspect-ratio:5/4;overflow:hidden;
    border-radius:0;box-shadow:none;background:none}
  .imgs > figure img,.imgs > figure video{position:absolute;inset:0;width:100%%;height:100%%;
    object-fit:cover}
  /* Chromium prints a <video> as whichever frame is showing, which differs run to run.
     Print takes the poster instead, and reduced motion takes it on screen so that reader
     sees the frame the printed sheet carries. */
  .prt{display:none}
  @media (prefers-reduced-motion:reduce){.scr{display:none}.prt{display:block}}
  /* Below 600px a three-column slot is under 180px wide and stops reading as a photograph. */
  @media (min-width:600px){.imgs{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:900px){.imgs{grid-template-columns:repeat(3,minmax(0,1fr))}}

  .apps,.prints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    gap:var(--sp-lg)}
  .app{display:flex;flex-direction:column;gap:var(--sp-xs)}
  .appbody{flex:1;padding:var(--sp-md);display:flex;flex-direction:column;
    gap:var(--sp-sm);min-height:168px}
  .appimg{flex:1;min-height:76px}
  .aname{margin:0;font-family:var(--display);font-size:var(--md)}
  .btn{display:inline-block;padding:var(--sp-sm) var(--sp-md);font-size:var(--xs);
    letter-spacing:.08em;text-transform:uppercase;text-align:center;
    transition:background var(--dur) var(--ease)}
  .step{padding:var(--sp-xs) var(--sp-md);font-size:var(--xs);color:var(--muted)}
  .pcard{aspect-ratio:85/55;background:var(--fall);display:flex;align-items:flex-end;
    padding:var(--sp-sm)}
  .plabel{aspect-ratio:3/4;background:var(--fall);display:flex;flex-direction:column;
    justify-content:space-between;padding:var(--sp-sm)}
  .pposter{aspect-ratio:2/3;background:var(--fall);display:flex;align-items:flex-start;
    padding:var(--sp-sm)}
  .pwm{font-family:var(--display);font-size:var(--lg);color:#080808}
  .pwm.sm{font-size:var(--md)}
  .pfine{font-size:var(--xs);color:rgba(238,236,234,.86)}

  .cover .covergrid{flex:1;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);
    gap:var(--sp-2xl);align-items:end;padding-bottom:var(--sp-xl)}
  .kick{margin:0 0 var(--sp-lg);font-size:var(--xs);letter-spacing:.14em;
    text-transform:uppercase}
  .wordmark{font-family:var(--display);font-weight:400;margin:0 0 var(--sp-md);
    font-size:clamp(var(--x3),10vw,8rem);line-height:.9;letter-spacing:-.02em}
  .covline{margin:0;font-family:var(--display);font-size:var(--x2);line-height:1.1}
  .covmeta{display:flex;flex-direction:column;gap:var(--sp-sm)}
  .cover .covmeta .pl{color:inherit;opacity:.78;max-width:34ch}

  a{color:#080808;text-underline-offset:3px}
  .panel a{color:var(--s1)}
  a:hover,a:focus-visible{color:#A8832F}

  @media (max-width:900px){
    .sheet{padding:var(--sp-lg) var(--sp-lg) 0;min-height:0}
    .grid,.cover .covergrid{grid-template-columns:1fr;gap:var(--sp-lg)}
    .srow dl,.rrs,.donts,.faces,.trio,.apps,.prints{grid-template-columns:1fr}
    .fallspec{grid-template-columns:1fr}
    .fallmeta,.fallspec{min-width:0}
    .fallbar{min-height:90px}
    .tstep{grid-template-columns:40px minmax(0,1fr);row-gap:2px}
    .tnum{grid-column:2;text-align:left}
    .foot{grid-template-columns:1fr auto}
    .foot span:nth-child(2),.foot .doc{display:none}
    .panel{padding:var(--sp-md)}
    /* The scroll belongs to the panel, not the table: display:block on a table
       stops its cells shrinking, so the row pushed the page sideways instead. */
    .panel{overflow-x:auto}
    .gcols{grid-template-columns:repeat(6,1fr);height:70px;gap:var(--sp-sm)}
    .srow{grid-template-columns:56px minmax(0,1fr);gap:var(--sp-md)}
    .sstep{grid-template-columns:36px minmax(0,1fr) 56px}
    .wmtext{font-size:clamp(32px,11vw,86px)}
    .wordmark{font-size:clamp(40px,15vw,8rem)}
  }

  @page{margin:0;size:Letter landscape}
  @media print{
    :root{--sheet-h:8.05in}
    .sheet{break-after:page;page-break-after:always;min-height:0;height:8.05in;
      padding:0.36in 0.5in 0;overflow:hidden}
    .scr{display:none}
    .prt{display:block}
    .sheet:last-child{break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body>
<main class="deck">
%(sheets)s</main>
</body>
</html>
